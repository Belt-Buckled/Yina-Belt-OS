<title>First Thousand</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="appcss"></style>

<script type="application/json" id="data">{"entries":[]}</script>

<div id="root"></div>

<script id="app-script">
const CSS = String.raw`
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F9FC; --border:#DCE1EC; --border-strong:#C3CBDC;
  --text:#171A23; --muted:#5C6580; --faint:#8A93AB;
  --accent:#B5115B; --accent-soft:#FBE7F0; --accent-ink:#8E0D47;
  --c-cyan:#0A7FA8; --c-magenta:#B5115B; --c-yellow:#9A7500; --c-key:#2B3040;
  --good:#146F52; --good-soft:#E2F2EC; --warn:#95560A; --warn-soft:#FBEEDD; --crit:#A31F1A;
  --shadow:0 1px 2px rgba(23,26,35,.06), 0 8px 24px -12px rgba(23,26,35,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0E14; --surface:#151924; --surface-2:#1B202D; --border:#262C3B; --border-strong:#364054;
    --text:#E8EBF3; --muted:#9AA3BA; --faint:#6D7794;
    --accent:#FF5C9E; --accent-soft:#33121F; --accent-ink:#FF87B7;
    --c-cyan:#3FB6DE; --c-magenta:#FF5C9E; --c-yellow:#D9AE2E; --c-key:#98A2BC;
    --good:#3FC79A; --good-soft:#0F2A22; --warn:#E0A44A; --warn-soft:#2C2013; --crit:#F2726B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0C0E14; --surface:#151924; --surface-2:#1B202D; --border:#262C3B; --border-strong:#364054;
  --text:#E8EBF3; --muted:#9AA3BA; --faint:#6D7794;
  --accent:#FF5C9E; --accent-soft:#33121F; --accent-ink:#FF87B7;
  --c-cyan:#3FB6DE; --c-magenta:#FF5C9E; --c-yellow:#D9AE2E; --c-key:#98A2BC;
  --good:#3FC79A; --good-soft:#0F2A22; --warn:#E0A44A; --warn-soft:#2C2013; --crit:#F2726B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px; margin:0 auto; padding:28px 20px 72px; display:flex; flex-direction:column; gap:24px}

h1,h2,h3{font-family:Archivo,system-ui,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.015em}
h1{font-size:clamp(28px,4.4vw,40px); font-weight:800; line-height:1.05}
h2{font-size:16px; font-weight:700}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

header .sub{color:var(--muted); max-width:62ch; margin-top:8px}
header .rule{height:3px; width:56px; background:var(--accent); border-radius:2px; margin-top:14px}

.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow)}
.card-pad{padding:20px}

/* progress */
.goal{display:flex; flex-direction:column; gap:14px}
.goal-top{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px}
.goal-figure{font-family:Archivo,sans-serif; font-weight:800; font-size:clamp(30px,5vw,44px); line-height:1; letter-spacing:-.02em}
.goal-figure small{font-weight:600; font-size:.42em; color:var(--muted); letter-spacing:0; margin-left:8px}
.bar{position:relative; height:14px; background:var(--surface-2); border:1px solid var(--border); border-radius:99px; overflow:hidden}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--c-cyan),var(--accent)); border-radius:99px; transition:width .4s ease}
.bar-pace{position:absolute; top:-5px; bottom:-5px; width:2px; background:var(--text); opacity:.55}
.bar-legend{display:flex; justify-content:space-between; font-size:12px; color:var(--muted)}

/* tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 15px; display:flex; flex-direction:column; gap:5px}
.tile .k{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-family:"IBM Plex Mono",monospace}
.tile .v{font-family:Archivo,sans-serif; font-weight:700; font-size:24px; line-height:1.1; font-variant-numeric:tabular-nums}
.tile .n{font-size:12px; color:var(--muted); line-height:1.35}
.tile.signal{border-color:var(--accent); background:var(--accent-soft)}
.tile.signal .v{color:var(--accent-ink)}

/* table */
.tablewrap{overflow-x:auto; border-radius:12px}
table{width:100%; border-collapse:collapse; min-width:820px; background:var(--surface)}
thead th{
  text-align:left; font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500;
  letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
  padding:11px 12px; border-bottom:1px solid var(--border-strong); white-space:nowrap;
}
tbody td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:top}
tbody tr:last-child td{border-bottom:none}
td.money{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
td.item{font-weight:500}
tr.excluded{background:var(--surface-2)}
tr.excluded td{color:var(--muted)}
.empty{padding:40px 20px; text-align:center; color:var(--muted); background:var(--surface)}
.empty strong{display:block; color:var(--text); font-family:Archivo,sans-serif; font-size:16px; margin-bottom:6px}

.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
  padding:2px 8px; border-radius:99px; border:1px solid var(--border-strong);
  color:var(--muted); background:var(--surface-2); white-space:nowrap;
}
.chip::before{content:""; width:6px; height:6px; border-radius:99px; background:currentColor}
.chip.stranger{color:var(--good); background:var(--good-soft); border-color:transparent}
.chip.referral{color:var(--c-cyan); border-color:transparent; background:var(--surface-2)}
.chip.before{color:var(--warn); background:var(--warn-soft); border-color:transparent}
.line-dot{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:7px; vertical-align:1px}

/* form */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
label{display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:600; color:var(--muted)}
input,select{
  font:inherit; font-size:14px; color:var(--text); background:var(--surface-2);
  border:1px solid var(--border-strong); border-radius:8px; padding:8px 10px; width:100%;
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button{
  font:inherit; font-weight:600; font-size:14px; cursor:pointer; border-radius:8px;
  border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text); padding:9px 16px;
}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
button.primary:disabled{opacity:.5; cursor:not-allowed}
button.link{border:none; background:none; color:var(--muted); padding:4px 6px; font-size:12px; text-decoration:underline}
button.link:hover{color:var(--crit)}
.actions{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:16px}
.status{font-size:13px; color:var(--muted)}
.status.ok{color:var(--good)} .status.bad{color:var(--crit)}

.note{font-size:13px; color:var(--muted); max-width:70ch}
.note b{color:var(--text)}
.readonly-banner{
  display:none; background:var(--warn-soft); color:var(--warn); border:1px solid transparent;
  border-radius:10px; padding:12px 14px; font-size:13px;
}
:root.is-readonly .readonly-banner{display:block}
:root.is-readonly .writer-only{display:none}
footer{font-size:12px; color:var(--faint); border-top:1px solid var(--border); padding-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
`;
document.getElementById('appcss').textContent = CSS;

const START = '2026-08-24';
const DEADLINE = '2026-11-20';
const GOAL = 1000;

const LINES = [
  ['apparel-kids','Apparel, kids','var(--c-magenta)'],
  ['apparel-adult','Apparel, adult','var(--c-cyan)'],
  ['favors','Party favors & decor','var(--c-yellow)'],
  ['digital','Digital file / transfer','var(--c-key)'],
  ['other','Other','var(--faint)']
];
const CHANNELS = ['FB Marketplace','Instagram','Facebook DM','Etsy','Text','In person','Other'];
const BUYERS = [['family','Family'],['friend','Friend'],['referral','Referral'],['stranger','Stranger']];

let state = JSON.parse(document.getElementById('data').textContent || '{"entries":[]}');
if (!Array.isArray(state.entries)) state.entries = [];
let dirty = false, saving = false, statusMsg = '', statusKind = '';

const money = n => '$' + (Math.round(n*100)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lineOf = id => LINES.find(l => l[0] === id) || LINES[4];
const counts = e => e.date >= START;

function stats(){
  const live = state.entries.filter(counts);
  const gross = live.reduce((a,e) => a + (+e.gross||0), 0);
  const cogs  = live.reduce((a,e) => a + (+e.cogs||0), 0);
  const stranger = live.filter(e => e.buyer==='stranger' || e.buyer==='referral')
                       .reduce((a,e) => a + (+e.gross||0), 0);
  const today = new Date();
  const s = new Date(START+'T00:00:00'), d = new Date(DEADLINE+'T00:00:00');
  const total = Math.max(1,(d-s)/864e5);
  const gone = Math.min(total, Math.max(0,(today-s)/864e5));
  const left = Math.max(0, Math.ceil((d-today)/864e5));
  return {
    gross, cogs, net: gross-cogs, orders: live.length,
    avg: live.length ? gross/live.length : 0,
    stranger, remaining: Math.max(0, GOAL-gross),
    pct: Math.min(100, gross/GOAL*100), pacePct: gone/total*100,
    weeksLeft: Math.max(0, left/7), daysLeft: left,
    excluded: state.entries.length - live.length
  };
}

function render(){
  const s = stats();
  const perWeek = s.weeksLeft > 0.15 ? s.remaining / s.weeksLeft : s.remaining;
  const onPace = s.pct >= s.pacePct;
  const rows = state.entries.slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));

  document.getElementById('root').innerHTML = `
  <div class="wrap">
    <header>
      <div class="eyebrow">Week 1 begins ${START} &nbsp;/&nbsp; deadline ${DEADLINE}</div>
      <h1>First Thousand</h1>
      <p class="sub">Every sale, from the start line forward. Nothing before ${START} counts &mdash; those
      orders are proof, not revenue against this goal.</p>
      <div class="rule"></div>
    </header>

    <div class="readonly-banner">You are viewing this read-only. You can read the log, but changes will not save.</div>

    <section class="card card-pad goal">
      <div class="goal-top">
        <div class="goal-figure num">${money(s.gross)}<small>of ${money(GOAL)}</small></div>
        <div class="eyebrow">${s.daysLeft} days left</div>
      </div>
      <div class="bar">
        <div class="bar-fill" style="width:${s.pct}%"></div>
        <div class="bar-pace" style="left:${Math.min(100,s.pacePct)}%" title="Where you'd be on even pace"></div>
      </div>
      <div class="bar-legend">
        <span>${s.pct.toFixed(0)}% collected</span>
        <span style="color:${onPace?'var(--good)':'var(--warn)'}">
          ${onPace ? 'Ahead of even pace' : 'Behind even pace'} &middot; even pace marker at ${s.pacePct.toFixed(0)}%
        </span>
      </div>
    </section>

    <section class="tiles">
      <div class="tile signal">
        <div class="k">Signal &middot; outside the circle</div>
        <div class="v num">${money(s.stranger)}</div>
        <div class="n">From strangers and referrals. Every paid order before the start line came from family. This is the number that proves a business.</div>
      </div>
      <div class="tile">
        <div class="k">Still to collect</div>
        <div class="v num">${money(s.remaining)}</div>
        <div class="n">${s.remaining > 0 ? money(perWeek) + ' per week from here' : 'Goal met.'}</div>
      </div>
      <div class="tile">
        <div class="k">Orders</div>
        <div class="v num">${s.orders}</div>
        <div class="n">${s.orders ? money(s.avg) + ' average order' : 'No sales logged yet'}</div>
      </div>
      <div class="tile">
        <div class="k">Kept after materials</div>
        <div class="v num">${money(s.net)}</div>
        <div class="n">${money(s.cogs)} spent on blanks, transfers and shipping</div>
      </div>
    </section>

    <section>
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px">
        <h2>The log</h2>
        <span class="eyebrow">${state.entries.length} ${state.entries.length===1?'entry':'entries'}${s.excluded?` &middot; ${s.excluded} before start line`:''}</span>
      </div>
      <div class="tablewrap card">
        ${rows.length ? `
        <table>
          <thead><tr>
            <th>Date</th><th>What sold</th><th>Line</th><th>Channel</th><th>Buyer</th>
            <th style="text-align:right">Collected</th><th style="text-align:right">Materials</th>
            <th style="text-align:right">Kept</th><th></th>
          </tr></thead>
          <tbody>${rows.map(e => {
            const L = lineOf(e.line), out = !counts(e), kept = (+e.gross||0)-(+e.cogs||0);
            const b = BUYERS.find(x => x[0]===e.buyer);
            return `<tr class="${out?'excluded':''}">
              <td class="num" style="white-space:nowrap">${esc(e.date||'')}${out?'<br><span class="chip before">before start</span>':''}</td>
              <td class="item">${esc(e.item||'')}</td>
              <td><span class="line-dot" style="background:${L[2]}"></span>${L[1]}</td>
              <td>${esc(e.channel||'')}</td>
              <td><span class="chip ${e.buyer==='stranger'?'stranger':e.buyer==='referral'?'referral':''}">${b?b[1]:''}</span></td>
              <td class="money">${money(+e.gross||0)}</td>
              <td class="money">${money(+e.cogs||0)}</td>
              <td class="money" style="color:${kept<0?'var(--crit)':'inherit'}">${money(kept)}</td>
              <td class="writer-only"><button class="link" data-del="${esc(e.id)}">Remove</button></td>
            </tr>`;
          }).join('')}</tbody>
        </table>` : `
        <div class="empty">
          <strong>Nothing logged yet. That is correct.</strong>
          The tracker starts empty on purpose. The first row you add is the first sale that counts.
        </div>`}
      </div>
    </section>

    <section class="card card-pad writer-only">
      <h2 style="margin-bottom:14px">Log a sale</h2>
      <form id="add">
        <div class="grid">
          <label>Date<input type="date" name="date" value="${new Date().toISOString().slice(0,10)}" required></label>
          <label>What sold<input name="item" placeholder="Birthday shirt, 5T" required></label>
          <label>Product line<select name="line">${LINES.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join('')}</select></label>
          <label>Channel<select name="channel">${CHANNELS.map(c=>`<option>${c}</option>`).join('')}</select></label>
          <label>Buyer<select name="buyer">${BUYERS.map(b=>`<option value="${b[0]}">${b[1]}</option>`).join('')}</select></label>
          <label>Collected<input name="gross" type="number" min="0" step="0.01" placeholder="0.00" required></label>
          <label>Materials cost<input name="cogs" type="number" min="0" step="0.01" placeholder="0.00"></label>
        </div>
        <div class="actions">
          <button type="submit">Add to log</button>
          <button type="button" class="primary" id="save" ${dirty?'':'disabled'}>${saving?'Saving...':'Save changes'}</button>
          <span class="status ${statusKind}">${dirty && !saving ? 'Unsaved changes' : esc(statusMsg)}</span>
        </div>
      </form>
      <p class="note" style="margin-top:14px"><b>Materials cost</b> is the landed cost: blank plus transfer plus
      shipping, for this order only. Fill it in every time. It is the number that stopped the concert shirt
      from making money.</p>
    </section>

    <footer>
      Sales dated before ${START} are kept visible but excluded from the total, by decision.
      Add a row, then press <b>Save changes</b> — a row is not stored until you save.
    </footer>
  </div>`;

  document.getElementById('add')?.addEventListener('submit', onAdd);
  document.getElementById('save')?.addEventListener('click', onSave);
  document.querySelectorAll('[data-del]').forEach(b =>
    b.addEventListener('click', () => {
      state.entries = state.entries.filter(e => e.id !== b.dataset.del);
      dirty = true; statusMsg = ''; statusKind = ''; render();
    }));
}

function onAdd(ev){
  ev.preventDefault();
  const f = new FormData(ev.target);
  state.entries.push({
    id: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    date: f.get('date'), item: (f.get('item')||'').trim(), line: f.get('line'),
    channel: f.get('channel'), buyer: f.get('buyer'),
    gross: +f.get('gross') || 0, cogs: +f.get('cogs') || 0
  });
  dirty = true; statusMsg = ''; statusKind = ''; render();
}

function fullDoc(){
  const script = document.getElementById('app-script').textContent;
  const closer = '<' + '/script>';
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<title>First Thousand</title>'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800'
    + '&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">'
    + '<style id="appcss">' + CSS + '<' + '/style>'
    + '</head><body>'
    + '<script type="application/json" id="data">' + JSON.stringify(state) + closer
    + '<div id="root"></div>'
    + '<script id="app-script">' + script + closer
    + '</body></html>';
}

const capability = async () => {
  try { return (typeof claude !== 'undefined' && claude.use) ? await claude.use('artifact') : null; }
  catch { return null; }
};

async function onSave(){
  if (saving) return;
  const api = await capability();
  if (!api){ document.documentElement.classList.add('is-readonly'); render(); return; }
  saving = true; statusMsg = ''; render();
  try {
    await api.publish(fullDoc());
    dirty = false; statusMsg = 'Saved.'; statusKind = 'ok';
  } catch (err) {
    const code = err && err.code;
    if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'capability_disabled'){
      document.documentElement.classList.add('is-readonly');
      statusMsg = 'This view is read-only, so nothing was saved.'; statusKind = 'bad';
    } else if (code === 'conflict'){
      statusMsg = 'A newer version was saved elsewhere. Reloading to it.'; statusKind = 'bad';
    } else if (code === 'rate_limited'){
      statusMsg = 'Saving too often. Wait a moment and press Save again.'; statusKind = 'bad';
    } else if (code === 'too_large'){
      statusMsg = 'The log is too large to save. Archive older entries.'; statusKind = 'bad';
    } else {
      statusMsg = 'Save failed. Your rows are still here — press Save again.'; statusKind = 'bad';
    }
  } finally { saving = false; render(); }
}

render();
capability().then(api => {
  if (!api){ document.documentElement.classList.add('is-readonly'); render(); }
});
</script>
